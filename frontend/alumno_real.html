<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista del Alumno</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<script src="tema.js"></script>
<style>
  .aro-calificacion {
    width: 96px; height: 96px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 4px solid currentColor; margin: 0 auto;
  }
</style>
</head>
<body>

<div id="pantalla-verificando" class="min-h-screen flex items-center justify-center px-4">
  <p class="text-sm" style="color: var(--text-muted);">Verificando sesión…</p>
</div>

<div id="panel-alumno" class="hidden min-h-screen flex flex-col">

  <!-- Encabezado simple, sin sidebar (es un flujo lineal, no varias secciones) -->
  <header class="flex items-center justify-between gap-3 flex-wrap px-4 sm:px-6 py-3 sm:py-4 border-b" style="border-color: var(--border);">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm" style="background: var(--accent); color:#1a1206;">E</div>
      <span class="display font-semibold">Bitácora</span>
    </div>
    <div class="flex items-center gap-2 flex-wrap justify-end">
      <button class="theme-toggle" onclick="alternarTema()"></button>
      <a href="mi_perfil.html" class="btn text-sm">Mi perfil</a>
      <span id="sesion-info" class="text-xs hidden sm:inline" style="color: var(--text-muted);"></span>
      <button onclick="cerrarSesion()" class="btn text-sm">Cerrar sesión</button>
    </div>
  </header>

  <main class="flex-1 flex items-start justify-center p-4 sm:p-6 md:p-10">
    <div class="w-full max-w-lg">

      <!-- ---------- Unirse con código ---------- -->
      <div id="tarjeta-codigo" class="card p-8">
        <h1 class="text-xl font-semibold mb-1">Unirme a un examen</h1>
        <p class="text-sm mb-5" style="color: var(--text-muted);">Pídele el código de acceso a tu maestro.</p>
        <label class="text-sm block mb-4">Código de acceso
          <input type="text" id="input-codigo" placeholder="Ej. A1B2C3" style="text-transform:uppercase;">
        </label>
        <button class="btn btn-accent w-full" onclick="unirseAExamen()">Entrar al examen</button>
        <p id="codigo-error" class="text-sm mt-3 hidden" style="color: var(--danger);"></p>
      </div>

      <!-- ---------- Resolviendo el examen ---------- -->
      <div id="tarjeta-examen" class="hidden">
        <div class="flex items-baseline justify-between mb-4">
          <h1 id="titulo-examen" class="text-xl font-semibold"></h1>
          <span id="contador-preguntas" class="text-xs" style="color: var(--text-muted);"></span>
        </div>
        <form id="form-respuestas"></form>
        <button class="btn btn-accent w-full mt-2" onclick="entregarExamen()">Entregar examen</button>
        <p id="entrega-error" class="text-sm mt-3 hidden" style="color: var(--danger);"></p>
      </div>

      <!-- ---------- Resultado ---------- -->
      <div id="tarjeta-resultado" class="hidden card p-8 text-center">
        <h1 class="text-xl font-semibold mb-6">Resultado</h1>
        <div id="res-aro" class="aro-calificacion mb-4">
          <span id="res-calificacion" class="text-2xl font-semibold display" style="color: var(--text);"></span>
        </div>
        <span id="res-veredicto" class="badge"></span>
        <button class="btn btn-accent w-full mt-6" onclick="descargarResultado()">Descargar resultado (PDF)</button>
        <p id="descarga-error" class="text-sm mt-3 hidden" style="color: var(--danger);"></p>
      </div>

    </div>
  </main>
</div>

<script src="alumno.js"></script>
</body>
</html>
